name: Publish development updates

on:
  push:
    branches: [main]
    paths:
      - 'updates/*.md'
      - '.github/workflows/announce.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-development-updates
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish new notes and refresh changed announcements
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for note in updates/*.md; do
            [[ "$note" =~ ^updates/([0-9]{4}-[0-9]{2}-[0-9]{2})\.md$ ]] || continue
            day=${BASH_REMATCH[1]}
            tag="update-$day"
            title="Development update · $day"
            if previous=$(gh release view "$tag" --json body --jq '.body'); then
              if [[ "$previous" != "$(cat "$note")" ]]; then
                gh release edit "$tag" --title "$title" --notes-file "$note"
              fi
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file "$note" --prerelease
            fi
          done
